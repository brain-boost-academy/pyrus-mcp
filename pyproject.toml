[project]
name = "pyrus-mcp"
version = "0.1.0"
description = "MCP-сервер поверх официальной библиотеки pyrus-api с трёхуровневым режимом доступа"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=4.0.1,<5",
    "jsonpickle<5",
    "pyrus-api==2.48.0",
]
license = "LicenseRef-PolyForm-Strict-1.0.0"
license-files = ["LICENSE.md"]

[project.scripts]
pyrus-mcp = "pyrus_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "pyright>=1.1.411", "pre-commit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyrus_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.pyright]
include = ["src", "tests"]
# strict дал бы 322 ошибки: у pyrus-api и jsonpickle нет типов, почти всё —
# reportUnknown*. Это шум, а не проверка.
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
