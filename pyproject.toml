[project]
name = "pyrus-mcp"
version = "0.1.0"
description = "MCP-сервер поверх официальной библиотеки pyrus-api с трёхуровневым режимом доступа"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=3.4.5",
    "pyrus-api==2.48.0",
]
license = "LicenseRef-PolyForm-Strict-1.0.0"
license-files = ["LICENSE.md"]

[project.scripts]
pyrus-mcp = "pyrus_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyrus_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    # exclude_args помечен deprecated, но остаётся рабочим способом убрать
    # offset из схемы пишущих инструментов. См. ponytail-комментарий в server.py.
    "ignore:The `exclude_args` parameter is deprecated",
]
